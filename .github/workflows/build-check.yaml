# Plain build for forks. The upstream "Build and Publish" workflow needs the self-hosted runners of IntelligenceModding.
name: Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 17 is the compile toolchain, the last entry (21) is used to run Gradle itself, see .tool-versions
          java-version: |
            17
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assemble --stacktrace
      - name: Checkstyle
        # Informational, the upstream project is not guaranteed to be clean on every branch
        continue-on-error: true
        run: ./gradlew checkstyleMain --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedPeripherals-build
          path: build/libs/*.jar
          if-no-files-found: error
